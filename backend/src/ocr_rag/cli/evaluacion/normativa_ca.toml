# Set de evaluación del RAG sobre el corpus normativo centroamericano (CAUCA IV + RECAUCA IV).
# Lo usa `python -m ocr_rag.cli evaluar`.
#
# Cada caso lleva los artículos que una buena respuesta debe RECUPERAR (entre las fuentes) y
# CITAR (en el texto de la respuesta). Los números de artículo se verificaron contra el índice
# extraído de los PDF cargados (FAOLEX: CAUCA IV Res. 223-2008, RECAUCA IV Res. 224-2008) el
# 2026-09-26; no se tomaron de memoria.
#
# `esperados` son los artículos centrales: el sistema aprueba la recuperación si trae AL MENOS
# uno, pero la respuesta ideal cita todos. Si una reforma posterior cambia la numeración, este
# archivo se actualiza junto con el corpus.
#
# Tipos de caso (campo `nota`):
#   definicion   la respuesta es un artículo que define el concepto
#   requisitos   hay que enumerar condiciones u obligaciones
#   codigo+regl  la respuesta completa combina el CAUCA (qué) con el RECAUCA (cómo)
#   plazo        la pregunta busca un dato concreto (plazo, monto, momento)

# --- Tránsito aduanero (caso de las pruebas manuales) --------------------------------------

[[caso]]
id = "transito-definicion"
pregunta = "¿Qué es el tránsito aduanero?"
esperados = [{ norma = "CAUCA IV", articulo = "94" }]
nota = "definicion. En las pruebas manuales este artículo quedó último o fuera del top 5."

[[caso]]
id = "transito-requisitos"
pregunta = "¿Qué es el tránsito aduanero y qué requisitos tiene?"
esperados = [
  { norma = "CAUCA IV", articulo = "94" },
  { norma = "CAUCA IV", articulo = "95" },
  { norma = "RECAUCA IV", articulo = "393" },
]
nota = "codigo+regl. Definición (Art. 94), registro regional del transportista (Art. 95) y documentos que sustentan la declaración (RECAUCA 393)."

[[caso]]
id = "transito-plazo-inicio"
pregunta = "¿Desde cuándo se empieza a contar el plazo de un tránsito aduanero?"
esperados = [{ norma = "RECAUCA IV", articulo = "395" }]
nota = "plazo"

[[caso]]
id = "transito-plazos-rutas"
pregunta = "¿Quién fija los plazos y las rutas para una operación de tránsito?"
esperados = [{ norma = "RECAUCA IV", articulo = "396" }]
nota = "plazo"

[[caso]]
id = "dispositivos-seguridad"
pregunta = "¿Qué son los dispositivos de seguridad que se colocan en las unidades de transporte?"
esperados = [{ norma = "CAUCA IV", articulo = "96" }]
nota = "definicion. Marchamos, precintos y sellos."

