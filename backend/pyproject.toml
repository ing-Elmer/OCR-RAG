[project]
name = "ocr-rag"
version = "0.1.0"
description = "Backend de OCR-RAG: OCR de documentos + búsqueda semántica (RAG) sobre PostgreSQL/pgvector."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "openai>=1.54",
    "pypdfium2>=5.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `File(...)`/`Form(...)` en defaults son el patrón idiomático de FastAPI para multipart.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["ocr_rag"]

[[tool.importlinter.contracts]]
name = "Capas de la arquitectura"
type = "layers"
layers = [
    "ocr_rag.api | ocr_rag.cli",
    "ocr_rag.application",
    "ocr_rag.core",
]

[[tool.importlinter.contracts]]
name = "application y core no importan infrastructure"
type = "forbidden"
source_modules = ["ocr_rag.application", "ocr_rag.core"]
forbidden_modules = ["ocr_rag.infrastructure"]

[[tool.importlinter.contracts]]
name = "infrastructure no importa api ni application"
type = "forbidden"
source_modules = ["ocr_rag.infrastructure"]
forbidden_modules = ["ocr_rag.api", "ocr_rag.application", "ocr_rag.cli"]
